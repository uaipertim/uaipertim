<!doctype html>
<html lang="en" class="app-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UaiPertim</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta name="theme-color" content="#f04b2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UaiPertim" />
    <link rel="preload" href="/brand/uaipertim-logo-oficial-v2.png" as="image" type="image/png" />
    <style>
      /* Critical CSS for Boot Splash */
      html.app-booting {
        overflow: hidden;
        background-color: #FAF8F5;
      }
      html.app-booting #root {
        visibility: hidden;
        height: 0;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        background-color: #FAF8F5;
        padding-top: calc(3rem + env(safe-area-inset-top, 0px));
        padding-bottom: calc(3rem + env(safe-area-inset-bottom, 0px));
        opacity: 1;
        box-sizing: border-box;
        transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1), transform 450ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot-splash.boot-splash-exit {
        opacity: 0;
        transform: scale(0.97);
        pointer-events: none;
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 280px;
        width: 100%;
      }
      .boot-splash-logo {
        width: 14rem; /* w-56 (224px) */
        height: 14rem; /* h-56 (224px) */
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }
      .boot-splash-signature {
        margin-top: 1.25rem; /* mt-5 */
        display: inline-flex;
        align-items: center;
        gap: 0.5rem; /* 8px */
        padding: 0.375rem 0.875rem; /* px-3.5 py-1.5 */
        background-color: rgba(233, 79, 47, 0.05); /* very subtle coral background */
        border: 1px solid rgba(233, 79, 47, 0.15); /* subtle coral border */
        border-radius: 9999px; /* capsule rounded-full */
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: #753326; /* deep rich contrast coral-brown */
        user-select: none;
        
        /* Subtle entry animation */
        opacity: 0;
        transform: translateY(6px);
        animation: boot-signature-fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 200ms;
      }
      .boot-splash-signature-dot-left {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background-color: #E94F2F; /* bright coral */
      }
      .boot-splash-signature-dot-right {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background-color: #F59E0B; /* warm amber/gold */
      }
      @keyframes boot-signature-fade-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .boot-splash-loader-container {
        display: flex;
        gap: 0.625rem; /* gap-2.5 */
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
      }
      .boot-splash-dot {
        width: 10px; /* w-2.5 */
        height: 10px; /* h-2.5 */
        border-radius: 9999px;
        background-color: #E94F2F;
        opacity: 0.4;
        animation: boot-dot-pulse 1.2s infinite ease-in-out;
      }
      .boot-splash-dot:nth-child(1) {
        animation-delay: 0s;
      }
      .boot-splash-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .boot-splash-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes boot-dot-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.4);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Instant static boot splash -->
    <div id="boot-splash" aria-hidden="true">
      <div style="width: 100%; flex-shrink: 0; height: 1rem;"></div>
      <div class="boot-splash-content">
        <img
          src="/brand/uaipertim-logo-oficial-v2.png"
          alt="UaiPertim Logo Oficial"
          class="boot-splash-logo"
        />
        <div class="boot-splash-signature">
          <span class="boot-splash-signature-dot-left"></span>
          <span>Feito em Minas</span>
          <span class="boot-splash-signature-dot-right"></span>
        </div>
      </div>
      <div class="boot-splash-loader-container">
        <span class="boot-splash-dot"></span>
        <span class="boot-splash-dot"></span>
        <span class="boot-splash-dot"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
